<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>

    <style>

    header {
    background: #5f0219;
    color: white;
    padding: 20px;
    text-align: center;
    }

    nav a {
    color: #FCE8F1;
    margin: 0 15px;
    text-decoration: none;
    font-family: Arial, sans-serif;
    }
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit';
            background: linear-gradient(#ffdad5, #fff7f9);
        }

        .contact-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }

        .contact-left {
            display: flex;
            flex-direction: column;
            align-items: start;
            gap: 20px;
        }

        .contact-left-title h2 {
            font-weight: 600;
            color: #5f0219;
            font-size: 40px;
            margin-bottom: 5px;
        }

        .contact-left-title hr {
            border: none;
            width: 120px;
            height: 5px;
            background-color: #5f0219;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .contact-inputs {
            width: 400px;
            height: 50px;
            border: none;
            outline: none;
            padding-left: 25px;
            font-weight: 500;
            color: #666;
            border-radius: 50px;
        }

        .contact-left textarea {
            height: 140px;
            padding-top: 15px;
            border-radius: 20px;
        }

        .contact-inputs:focus {
            border: 2px solid #7FADDC;
        }

        .contact-inputs::placeholder {
            color: #a9a9a9;
        }

        .contact-left button {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            font-size: 16px;
            color: #fff;
            gap: 10px;
            border: none;
            border-radius: 50px;
            background: #5f0219cd;
            cursor: pointer;
        }

        contact-right img {
            width: 500px;
            
        }

        @media (max-width:800px) {
            .contact-inputs {
                width: 80vw;
            }
            .contact-right {
                display: none;
            }
        }

        footer {
    background: #5f0219;
    color: #f3bee5;
    text-align: center;
    padding: 20px;
    margin-top: 40px;
}
    </style>

</head>
<body>
    <header>
    
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About me</a>
        <a href="contact.html">Contact me</a>
    </nav>
</header>

    <div class="contact-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
            <div class="contact-left-title">
                <h2>Send me a message!</h2>
                <hr>
            </div>
            <input type="hidden" name="access_key" value="b403bf8e-0225-4a2a-9cda-2ccb38879df2">
            <input type="text" name="name" placeholder="Your Name" class="contact-inputs" required>
            <input type="email" name="email" placeholder="Your Email" class="contact-inputs" required>
            <textarea name="message" placeholder="Your Message" class="contact-inputs" required></textarea>
            <button type="submit">Submit</button>
       
        </form>
        <div class="contact-right">
            <img src="assets/snoopymail.jpg" alt="snoopy sending message" width=75%>
        </div>
    </div>
    <footer>
    <p style="color: #FCE8F1; font-family: Arial, sans-serif;">Akhila Yatnatti - 2026</p>
</footer>
</body>
</html>
